<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>AJOUT</title>
        <style>
            body{background: #eee;height: 100%;margin: 25px 0;padding-left: 300px;}            
            button{border-radius: 12px;color:aqua;background-color: #04AA6D;cursor:pointer;}
        </style>
    </head>
    <body>
        <form method="POST" action="/ajout_livre">
            {% csrf_token %}
            <div>
                <br>
                <p>
                    <h3>AJOUTER UNE LIVRE</h3>
                </p>
                <div>
                    <p>Categorie:</p>{{form.categorie}}
                </div>
                <div>
                    <p>ID livre:</p>{{form.id_livre}}
                </div>
                <div>
                    <p>Id auteur:</p>{{form.id_auteur}}
                </div>
                <div>
                    <p>Titre:</p>{{form.titre}}
                </div>
                <div>
                    <p>Exemplaires:</p>{{form.exemplaire}}
                </div>
                <div>
                    <p>Annee publication:</p>{{form.annee_publication}}
                </div>
                <div>
                    <br>
                    <button type="submit">CONFIRME</button>
                </div>
            </div>
        </form>
    </body>
</html>
