{% extends 'app/layouts/default.html' %}
{% block content %}

<div class="main-panel"style="background:#c7c8ca;">
    <div class="content">
        <div class="page-inner">
            <div class="page-header">
                <h4 class="page-title">Ajouter un emprunt</h4>
                <div class="btn-group btn-group-page-header ml-auto">
                    <button type="button" class="btn btn-light btn-round btn-page-header-dropdown dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class="fa fa-ellipsis-h"></i>
                    </button>
                    <div class="dropdown-menu">
                        <div class="arrow"></div>
                        <a class="dropdown-item" href="#">Action</a>
                        <a class="dropdown-item" href="#">Another action</a>
                        <a class="dropdown-item" href="#">Something else here</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">Separated link</a>
                    </div>
                </div>
            </div>

<div class="container-fluid">
    <form action = "{% url 'lecteur_update' lecteur.id %}" method='POST'>
        {%csrf_token%}
        <div class="form-group">
            {{lecteurForm.nom}}
            {{lecteurForm.prenom}}
            {{lecteurForm.Adress}}
            {{lecteurForm.categorie}}
            {{lecteurForm.telephone}}
        </div>
        <button type="submit" class= "btn btn-primary">Modifier</button>    
    </form>    
    
</div>

{% endblock  %}
