{% extends 'app/home/index.html' %} {%load static %} {%block pageContent %}
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-compatible" content="IE=edge">
        <title>Signin form </title>
        <meta name="description" content="">
        <meta name="viewport" content="">
        <link rel="stylesheet" href="">
    </head>
    <style>
body{
    display: flex;
    background-image:url("{% static 'app/assets/img/wallpaper.jpg' %}");
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
}
    </style>
<body>
    <div class="d-flex flex-column w-100 justify-content-center align-items-center">
       <div class="form-box signin">
        <h2>SignIn</h2>
        <form action="/signin" method="post">
            {% csrf_token %}
            <div>
            <label for="">Username</label>
            <input type="username" id="username" name="username" placeholder="Enter username"Required>
            </div>
            <br>
            <div>
            <label for="">Password</label>
            <input type="password" id="pass1" name="pass1" placeholder="Enter Password"Required>
            </div>
            <br>
            <button type="submit">Sign In</button>
            <a href="{% url 'signup' %}" >Create an account</a>
            
         </form>
       </div>
        
            
    
    </div>

</body>
