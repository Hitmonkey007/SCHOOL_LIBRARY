{%load static %}
<html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-compatible" content="IE=edge">
        <title>Signup form </title>
        <meta name="description" content="">
        <meta name="viewport" content="">
        <link rel="stylesheet" href="">
    <style>

            body{
                display: flex;
                
                background-image:url("{% static 'app/assets/img/wallpaper.jpg' %}");
                background-repeat: no-repeat;
                background-size: cover;
                }
                .box{
                    padding: 0.1000px;
                    margin:10px;
                    width: 45%;
                    border-radius: 30px;
                    background-color: rgba(0, 0, 0, 0.5); 
                    box-shadow: inset -5px -5px rgba(0, 0, 0, 0.2);
                    color: white;
                    font-size= 2rem;
                 }
                h1{
                    align: center center;
                    margin-top: 100px;
                    font-size= 2rem;
                    border-bottom: 4px solid rgba(0, 0, 0, 0.9);
                   }
            .signup{
                height: 500px;
                width: 400px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                overflow: auto;
                border: 1px solid black;
                align-items: center;
                margin: auto;
                margin-top: 125px;
                margin-left: 450px;
                background-color: rgba(0, 0, 0, 0.2); 
                border-radius: 50px;
                box-shadow: inset -5px -5px rgba(0, 0, 0, 0.2);
                 }

            .logo{
                width: 200px;
                margin-top: 200px;
                width: 30%;
                margin-left: 120px;
                border-radius: 50px;
                }

             button[type=submit]{
                    padding: 10px 10px;
                    margin-left: 50px;
                    background-color: rgba(0, 0, 0, 0.5);
                    box-shadow: inset -3px -3px rgba(0, 0, 0, 0.5);
                    color: white;
                    border: none;
                    outline: none;
                    border-radius: 20px;
                    font-size: 1rem; 
                     }

            button[type=submit]:hover{
                        cursor: pointer;
                        background-color: rgba(255, 255, 255, 0.1)
                        color: white;
                    }    
                    ::placeholder{
                        color: white;
                        opacity: 0.9;
                      }               
            
                </style>
    </head>
  
<body link="white" vlink="white" alink="white">
        <div class='Signup'>
            
            <form action="/signup" method="post">
                <div class="text-center">
                    <img src="{% static 'app/assets/img/logo.jpg' %}" class="logo" id="logo">
                </div> 
                {% csrf_token %}

                <h1>SCHOOL LIBRARY</h1>
            <div>
            <label for="">Username</label>
            <input type="text" id="username" class="box" name="username" placeholder="Create Username"Required>
            </div> 
             <br>
             <div>
            <label for="">First Name</label>
            <input type="text" id="fname" class="box"name="fname" placeholder="Enter Your First Name"Required>
             </div>
            <br>
            <div>
            <label for="">Last Name</label>
            <input type="text" id="lname" class="box" name="lname" placeholder="Enter Your Last Name"Required>
            </div>
            <br>
            <div>
            <label for="">Email</label>
            <input type="Email" id="email" class="box" name="Email" placeholder="Enter Your Email"Required>
            </div> 
            <br>
            <div>
            <label for="">Password</label>
            <input type="password" id="pass1" class="box" name="pass1" placeholder="Create Password"Required>
            </div>
            <br>
            <div>
            <label for="">Confirm Password</label>
            <input type="password" id="pass2" class="box" name="pass2" placeholder="Confirm Password" Required>
            </div>
            <br>
            <button type="submit">Sign Up</button>
            
            <a href="{% url 'signin' %}" > 
                <p>Already have an account?</p>
            </a>
          </form>
        </div>  
     
    
</body> 
</html>
