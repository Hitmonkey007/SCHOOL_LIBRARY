
 {% extends 'app/layouts/default.html' %}
 {% block content %}  

    <div class="signup-form">
        <form  method="post" class="form-horizontal">

    			<center><h2>Ajouter un lecteur</h2></center>

		{% csrf_token %}

            {% for field in form %}
            <div class="form-group text-center">
              <label class="control-label col-xs-4">{{ field.label_tag }}</label>
              <div class="col-xs-8">
              {{ field }}
               </div>
            </div>
            {% endfor %}


    		<div class="form-group text-center">
    			<div class="col-xs-8 col-xs-offset-4">
            <button type="submit" class="btn btn-success btn-lg" style="border-radius: 0%;">Ajouter</button>
    			</div>
    		</div>
        </form>
    	<div class="text-center">Voir les lecteurs<a href="lecteurs">Cliquer ici</a></div>
    </div>

 {% endblock  %}
